services:
  - type: web
    name: mobilestore
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir config config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
